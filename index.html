<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THE BUYER</title>
<meta name="description" content="A seven minute pixel game about how people decide to buy. Based on Leon Abboud's article.">
<meta property="og:title" content="THE BUYER">
<meta property="og:description" content="A seven minute pixel game about how people decide to buy. Based on Leon Abboud's article.">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:image" content="https://emreguney.github.io/grunt-quest/assets/screenshot-title.png">
<meta property="og:url" content="https://emreguney.github.io/grunt-quest/">
<meta name="theme-color" content="#1c1a2e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%231c1a2e'/%3E%3Cpath d='M1 1h2v1h2V1h2v3H6v1H5v1H4v1H3V6H2V5H1z' fill='%23d9463b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<script type="module">
  import { inject } from 'https://cdn.jsdelivr.net/npm/@vercel/analytics@2.0.1/dist/index.mjs';
  inject();
</script>
<style>
:root{
  --ink:#1c1a2e; --paper:#f7efd6; --sand:#e6c98a; --amber:#e08a2c; --teal:#2f9d8a; --deep:#1f5f58;
  --acid:#9fbf1f; --red:#d9463b; --mute:#b9a97a; --white:#fffaf0; --shade:#c9ad74;
  --ui:'Press Start 2P',monospace; --body:'Pixelify Sans','Press Start 2P',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0e0d15;overflow:hidden;color:var(--ink)}
body{font-family:var(--body);-webkit-font-smoothing:none;font-smooth:never}
::selection{background:var(--amber);color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
button:focus-visible,a:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
img,svg{image-rendering:pixelated;image-rendering:crisp-edges;display:block}

#stage-wrap{position:fixed;inset:0;display:grid;place-items:center}
#screen{position:relative;width:256px;height:240px;overflow:hidden;transform-origin:0 0;user-select:none;-webkit-user-select:none;outline:3px solid #2b2942;
  background:var(--sand) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32' shape-rendering='crispEdges'><rect width='32' height='32' fill='%23e6c98a'/><rect x='5' y='7' width='2' height='1' fill='%23d9b977'/><rect x='21' y='3' width='1' height='1' fill='%23d9b977'/><rect x='14' y='19' width='2' height='1' fill='%23d9b977'/><rect x='27' y='25' width='1' height='1' fill='%23d9b977'/><rect x='3' y='27' width='1' height='1' fill='%23d9b977'/></svg>")}
#screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='2' height='2' viewBox='0 0 2 2' shape-rendering='crispEdges'><rect x='1' y='0' width='1' height='2' fill='rgba(28,26,46,0.045)'/><rect x='0' y='1' width='1' height='1' fill='rgba(28,26,46,0.045)'/></svg>")}

/* type */
.ui{font-family:var(--ui);font-size:8px;line-height:10px;text-transform:uppercase;letter-spacing:0}
.body{font-family:var(--body);font-size:10px;line-height:11px;font-weight:500}
.tiny{font-family:var(--ui);font-size:6px;line-height:8px;text-transform:uppercase}

/* panel: paper with double ink frame */
.panel{position:relative;background:var(--paper);border:2px solid var(--ink);padding:6px 6px;box-shadow:inset 0 0 0 1px var(--white)}
.panel.dark{background:var(--ink);color:var(--paper);box-shadow:inset 0 0 0 1px var(--deep)}

/* hud */
#hud{position:absolute;top:0;left:0;right:0;height:14px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 4px;z-index:5;border-bottom:1px solid var(--deep)}
#hud .hearts{display:flex;gap:1px}
#hud .hearts svg{width:8px;height:8px}
#hud .score{color:var(--amber)}
#hud.hidden{display:none}

/* content root */
#view{position:absolute;inset:0}
#view.with-hud{top:14px}
.ground{position:absolute;left:0;right:0;bottom:0;height:20px;background:var(--deep) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='20' viewBox='0 0 16 20' shape-rendering='crispEdges'><rect width='16' height='20' fill='%231f5f58'/><rect x='2' y='2' width='1' height='3' fill='%232f9d8a'/><rect x='3' y='1' width='1' height='4' fill='%232f9d8a'/><rect x='10' y='6' width='1' height='3' fill='%232f9d8a'/><rect x='11' y='5' width='1' height='4' fill='%232f9d8a'/><rect x='6' y='12' width='1' height='3' fill='%232f9d8a'/><rect x='13' y='14' width='1' height='2' fill='%232f9d8a'/></svg>") repeat-x}
.horizon{position:absolute;left:0;right:0;bottom:20px;height:2px;background:var(--ink)}

/* buttons / options */
.opts{display:flex;flex-direction:column;gap:3px}
.opt{position:relative;display:flex;gap:4px;align-items:flex-start;width:100%;background:var(--paper);border:2px solid var(--ink);padding:3px 5px 3px 12px;color:var(--ink)}
.opt .k{flex:0 0 8px;font-family:var(--ui);font-size:8px;line-height:11px;color:var(--deep)}
.opt .t{flex:1;min-width:0}
.opt::before{content:"";position:absolute;left:3px;top:50%;margin-top:-4px;width:4px;height:8px;background:var(--ink);clip-path:polygon(0 0,100% 50%,0 100%);opacity:0}
.opt.sel{background:var(--white);box-shadow:inset 0 0 0 1px var(--ink)}
.opt.sel::before{opacity:1}
.opt.right{background:var(--teal);color:var(--white);box-shadow:none}
.opt.right .k{color:var(--white)}
.opt.wrong{background:var(--red);color:var(--white);box-shadow:none}
.opt.wrong .k{color:var(--white)}
.opt.dim{opacity:.45}
.opt[disabled]{cursor:default}
.opt[disabled]::before{opacity:0}
.opts,.msgs{padding-left:0}
.btn{display:inline-flex;align-items:center;gap:4px;background:var(--amber);color:var(--ink);border:2px solid var(--ink);padding:3px 6px;font-family:var(--ui);font-size:8px;line-height:10px;text-transform:uppercase}
.btn.sel{background:var(--ink);color:var(--amber)}
.btn.ghost{background:var(--paper)}
.btn.ghost.sel{background:var(--ink);color:var(--paper)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.right-al{justify-content:flex-end}

/* dialog */
.dialog{position:absolute;left:6px;right:6px;bottom:6px;min-height:52px}
.dialog .txt{min-height:33px}
.dialog .more{position:absolute;right:5px;bottom:3px;width:8px;height:8px;animation:bob 0.6s steps(2) infinite}
.dialog .who{position:absolute;top:-9px;left:4px;background:var(--ink);color:var(--paper);padding:1px 3px}
@keyframes bob{50%{transform:translateY(1px)}}
.portrait{position:absolute;width:64px;height:64px;border:2px solid var(--ink);background:var(--sand);box-shadow:inset 0 0 0 1px var(--white)}
.portrait img{width:100%;height:100%}
.portrait.shake{animation:shake .3s steps(3)}
@keyframes shake{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.portrait.nod{animation:nod .35s steps(2)}
@keyframes nod{50%{transform:translateY(2px)}}

/* title */
#title{position:absolute;inset:0;background:#e08a2c}
#title img.art{position:absolute;inset:0;width:256px;height:240px}
#title h1{position:absolute;top:22px;left:0;right:0;text-align:center;font-family:var(--ui);font-size:20px;line-height:22px;color:var(--paper);text-shadow:2px 2px 0 var(--ink);text-transform:uppercase}
#title h1 span{display:block}
#title .tag{position:absolute;top:70px;left:20px;right:20px;text-align:center;color:var(--ink);font-weight:700}
#title .start{position:absolute;left:120px;right:6px;top:104px;display:flex;justify-content:center}
#title .start .btn{animation:blink 1.2s steps(1) infinite}
@keyframes blink{0%,74%{opacity:1}75%,100%{opacity:0}}
#title .credit{position:absolute;left:0;right:0;bottom:0;padding:3px 0 2px;text-align:center;color:var(--paper);background:var(--ink)}
#title .credit a{color:var(--amber)}
#title .cont{position:absolute;left:120px;right:6px;top:124px;display:flex;justify-content:center}

/* map */
.map{position:absolute;inset:0}
.map .node{position:absolute;width:18px;height:18px;border:2px solid var(--ink);background:var(--paper);display:grid;place-items:center;font-family:var(--ui);font-size:8px;line-height:8px;box-shadow:inset 0 0 0 1px var(--white)}
.map .node.done{background:var(--teal);color:var(--white)}
.map .node.locked{background:var(--shade);color:var(--mute)}
.map .node.cur{background:var(--amber);animation:pulse 1s steps(2) infinite}
.map .node.locked svg{width:8px;height:8px}
@keyframes pulse{50%{transform:translateY(-1px)}}
.map .path{position:absolute;inset:0;pointer-events:none}
.map .sign{position:absolute;left:6px;top:6px}

/* generic stage layout */
.stage-root{position:absolute;inset:0}
.scene{position:absolute;left:8px;right:8px;top:4px;bottom:26px;min-height:0;overflow:hidden}
.stack{display:flex;flex-direction:column;gap:4px;min-height:0}
.label{font-family:var(--ui);font-size:8px;line-height:10px;text-transform:uppercase}
.quiz{gap:2px}
.quiz > *{flex-shrink:0}
.quiz .panel{padding:4px 5px}
.quiz .opt{padding:2px 4px 2px 12px}
.spacer{height:4px}

/* ladder */
.ladder{position:absolute;left:6px;right:6px;top:6px}
.rung{background:var(--ink);color:var(--paper);padding:1px 4px;margin-left:calc(var(--i) * 6px);flex-shrink:0}
.rung.first{background:var(--paper);color:var(--ink);border:2px solid var(--ink);box-shadow:inset 0 0 0 1px var(--white)}
.gap-play{gap:2px}
.gap-play > .stack{gap:1px;flex:0 0 auto;min-height:auto}
.gap-play .rung{padding:0 3px;font-size:9px;line-height:10px}
.gap-play .rung.first{padding:1px 3px}

/* doors: three shop fronts on a street */
.wall{position:relative;height:84px;background:var(--deep);border:2px solid var(--ink);display:flex;gap:8px;justify-content:center;align-items:flex-end;padding:6px 6px 0;overflow:hidden;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 16 16' shape-rendering='crispEdges'><rect width='16' height='16' fill='%231f5f58'/><rect x='0' y='7' width='16' height='1' fill='%2317463f'/><rect x='7' y='0' width='1' height='16' fill='%2317463f'/></svg>")}
.door{width:66px;height:72px;position:relative;background:var(--shade);border:2px solid var(--ink);border-bottom:0;border-radius:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:4px;color:var(--ink);gap:2px}
.door::before{content:"";position:absolute;top:4px;left:8px;right:8px;height:22px;background:#141326;border:2px solid var(--ink)}
.door>*{position:relative}
.door .k{position:absolute;top:8px;left:50%;margin-left:-4px;color:var(--amber)}
.door .ico{width:16px;height:16px;margin-bottom:2px}
.door .ico svg{width:16px;height:16px}
.door .lab{font-family:var(--ui);font-size:8px;line-height:8px;text-transform:uppercase}
.door.sel::before{background:var(--deep)}
.door.sel{outline:none;border-color:var(--paper)}
.door.right::before{background:var(--teal)}
.door.wrong::before{background:var(--red)}
.door.right,.door.wrong{color:var(--paper)}
.timer{height:8px;border:2px solid var(--ink);background:var(--paper);position:relative}
.timer i{position:absolute;left:0;top:0;bottom:0;background:var(--amber)}
.timer.low i{background:var(--red)}
.item{min-height:26px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700}

/* filter */
.brain{display:flex;justify-content:space-between;align-items:center}
.brain svg{width:24px;height:24px}
.msgs{display:flex;flex-direction:column;gap:3px}
.msg{min-height:38px}

/* buyer test */
.meter{display:flex;gap:2px}
.meter i{flex:1;height:8px;border:2px solid var(--ink);background:var(--paper)}
.meter i.on{background:var(--amber)}
.bubble{position:absolute;left:78px;top:6px;right:6px}
.bubble .panel{min-height:44px}
.buyer-say{position:absolute;left:0;top:70px;width:66px;text-align:center;color:var(--ink)}

/* bridge: two ledges, five discrete planks across the gap */
.sea{position:relative;height:38px;border:2px solid var(--ink);background:var(--deep);overflow:hidden;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='8' viewBox='0 0 16 8' shape-rendering='crispEdges'><rect width='16' height='8' fill='%231f5f58'/><rect x='2' y='5' width='4' height='1' fill='%232f9d8a'/><rect x='10' y='2' width='3' height='1' fill='%232f9d8a'/></svg>");background-position:0 28px;background-repeat:repeat-x}
.isle{position:absolute;bottom:0;height:22px;border-top:2px solid var(--ink);z-index:2;background:var(--sand) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='26' viewBox='0 0 16 26' shape-rendering='crispEdges'><rect width='16' height='26' fill='%23e6c98a'/><rect y='14' width='16' height='12' fill='%23c9ad74'/><rect x='2' y='14' width='3' height='1' fill='%23e6c98a'/><rect x='9' y='14' width='4' height='1' fill='%23e6c98a'/><rect x='4' y='18' width='1' height='4' fill='%237a4a2a'/><rect x='11' y='20' width='1' height='3' fill='%237a4a2a'/><rect x='0' y='24' width='16' height='2' fill='%237a4a2a'/></svg>") repeat-x}
.isle.now{left:0;width:56px}
.isle.after{right:0;width:56px}
.isle .lab{position:absolute;top:3px;left:0;right:0;text-align:center}
.deck{position:absolute;left:52px;right:52px;bottom:14px;height:12px;z-index:1}
.rail{position:absolute;left:0;top:-4px;height:2px;background:var(--ink);width:0}
.span{position:absolute;top:0;height:12px;box-sizing:border-box;border:2px solid var(--ink);background:var(--amber) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='12' viewBox='0 0 8 12' shape-rendering='crispEdges'><rect width='8' height='12' fill='%23e08a2c'/><rect x='0' y='4' width='8' height='1' fill='%23c96e20'/></svg>") repeat-x}
.walker{position:absolute;bottom:22px;left:22px;width:8px;height:12px;z-index:3}
.why-line{flex:1;color:var(--ink)}
.bridge-play{gap:2px}
.bridge-play .sea{flex:0 0 auto}
.bridge-play .gauges,.bridge-play .row{flex:0 0 auto}
.bridge-play .cards{gap:2px;flex:1;min-height:0;align-content:start}
.bridge-play .cards .opt{min-height:16px;padding:2px 3px;align-items:center}
.bridge-play .cards .opt .t{font-size:9px;line-height:10px}
.gauges{display:flex;gap:6px}
.gauge{flex:1}
.gauge .bar{height:6px;border:2px solid var(--ink);background:var(--paper);display:flex;gap:1px;padding:0}
.gauge .bar i{flex:1;background:transparent}
.gauge .bar i.on{background:var(--amber)}
.gauge.dist .bar i.on{background:var(--red)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.cards .opt{padding:2px 3px;min-height:16px;gap:3px}
.cards .opt::before{display:none}

/* result */
.rank{font-family:var(--ui);font-size:10px;line-height:12px;text-transform:uppercase;color:var(--ink);text-shadow:1px 1px 0 var(--amber)}
.method{display:grid;grid-template-columns:auto 1fr;gap:1px 6px}
.method b{font-family:var(--ui);font-size:6px;line-height:11px;color:var(--teal)}

.face{width:24px;height:24px;flex:0 0 24px;border:1px solid var(--ink);background:var(--sand)}

.board{font-family:var(--ui);font-size:6px;line-height:9px;text-transform:uppercase}
.board .row{display:grid;grid-template-columns:12px minmax(0,1fr) 40px;gap:4px;align-items:center;padding:1px 0}
.board .row span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .row.me{color:var(--amber)}
.name-in{width:100%;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:8px;line-height:16px;padding:4px 6px;text-transform:uppercase;caret-color:var(--ink)}
.name-in:focus{background:var(--white);box-shadow:inset 0 0 0 1px var(--ink);outline:none}
.name-in::placeholder{color:var(--mute)}

/* toast */
.toast{position:absolute;left:6px;right:6px;top:20px;text-align:center;z-index:6}

/* mute */
#mute{position:absolute;right:2px;top:2px;width:10px;height:10px;z-index:7;display:grid;place-items:center;background:var(--ink)}
#mute svg{width:8px;height:8px}

.fade{animation:fade .25s steps(4)}
@keyframes fade{from{opacity:0}}
.reduced *{animation:none!important}
</style>
</head>
<body>
<div id="stage-wrap">
  <div id="screen">
    <div id="hud" class="ui hidden"><span class="name"></span><span class="hearts"></span><span class="score"></span></div>
    <div id="view"></div>
    <button id="mute" aria-label="Toggle sound" title="Sound (M)"></button>
  </div>
</div>

<script>
(() => {

const SFX = {
  ctx: null, on: true,
  init() { if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; } } if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  tone(f, d, type, vol, when) {
    if (!this.on || !this.ctx) return; type = type || 'square'; vol = vol == null ? 0.06 : vol; when = when || 0;
    const t = this.ctx.currentTime + when, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + d + 0.02);
  },
  move() { this.tone(880, 0.04); },
  ok() { [523, 659, 784].forEach((f, i) => this.tone(f, 0.09, 'square', 0.06, i * 0.07)); },
  bad() { this.tone(140, 0.22, 'sawtooth', 0.07); this.tone(110, 0.22, 'square', 0.05, 0.05); },
  clear() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.11, 'square', 0.06, i * 0.09)); this.tone(1047, 0.35, 'square', 0.06, 0.38); },
  tick() { this.tone(1400, 0.03, 'square', 0.04); },

};

/* ---------- keyboard ---------- */
let keyHandler = null;
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if (keyHandler && keyHandler(e)) return;
  if (e.key === 'm' || e.key === 'M') muteBtn.click();
});

function bindKeys(buttons) {
  const list = [...buttons].filter(Boolean);
  if (!list.length) { keyHandler = null; return; }
  let sel = Math.max(0, list.findIndex(b => b.classList.contains('sel') && !b.disabled));
  const live = () => list.map((b, i) => (b.disabled ? -1 : i)).filter(i => i >= 0);
  const paint = () => list.forEach((b, i) => b.classList.toggle('sel', i === sel && !b.disabled));
  if (list[sel] && list[sel].disabled) sel = (live()[0] || 0);
  paint();
  list.forEach((b, i) => {
    b.addEventListener('mouseenter', () => {
      if (b.disabled || sel === i) return;
      sel = i;
      paint();
    });
  });
  keyHandler = e => {
    const on = live();
    if (!on.length) return false;
    if (list[sel] && list[sel].disabled) sel = on[0];
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= list.length && !list[n - 1].disabled) {
      e.preventDefault();
      list[n - 1].click();
      return true;
    }
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
      e.preventDefault();
      sel = on[(on.indexOf(sel) + 1) % on.length];
      paint(); SFX.move();
      return true;
    }
    if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
      e.preventDefault();
      sel = on[(on.indexOf(sel) - 1 + on.length) % on.length];
      paint(); SFX.move();
      return true;
    }
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      if (list[sel] && !list[sel].disabled) list[sel].click();
      return true;
    }
    return false;
  };
}

/* ---------- dialog (typewriter) ---------- */
function dialog(root, pages, opts, done) {
  opts = opts || {};
  const box = el('div', 'dialog panel body');
  if (opts.who) box.appendChild(el('span', 'who tiny', opts.who));
  const txt = el('div', 'txt'); box.appendChild(txt);
  const more = el('span', 'more', SPR.more); box.appendChild(more);
  root.appendChild(box);
  let i = 0, typing = null, full = false;
  function show() {
    const words = pages[i].split(' '); let n = 0; full = false; more.style.visibility = 'hidden'; txt.textContent = '';
    clearInterval(typing);
    typing = setInterval(() => {
      n++; txt.textContent = words.slice(0, n).join(' '); SFX.type();
      if (n >= words.length) { clearInterval(typing); full = true; more.style.visibility = 'visible'; }
    }, 55);
    G.timers.push(typing);
  }
  function advance() {
    if (!full) { clearInterval(typing); txt.textContent = pages[i]; full = true; more.style.visibility = 'visible'; return; }
    SFX.move(); i++;
    if (i < pages.length) show(); else { box.remove(); keyHandler = null; done && done(); }
  }
  box.addEventListener('click', advance);
  box.setAttribute('role', 'button'); box.tabIndex = 0;
  keyHandler = e => { if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight') { e.preventDefault(); advance(); return true; } return false; };
  show();
  return box;
}

/* options list with number keys */
function options(root, items, onPick, opts) {
  opts = opts || {};
  const list = el('div', opts.cls || 'opts body');
  let locked = false;
  items.forEach((it, idx) => {
    const b = el('button', 'opt');
    b.innerHTML = `<span class="k">${idx + 1}</span><span class="t">${it.text}</span>`;
    b.addEventListener('mouseenter', () => SFX.move());
    b.addEventListener('click', () => { if (locked) return; locked = true; list.querySelectorAll('.opt').forEach(o => o.disabled = true); onPick(it, b, list); });
    list.appendChild(b);
  });
  root.appendChild(list);
  bindKeys(list.querySelectorAll('.opt'));
  return list;
}

/* helper: a stage that is a sequence of multiple-choice rounds */
function quizStage(rounds, render, root, api, hooks) {
  hooks = hooks || {};
  let i = 0;
  const step = () => {
    root.innerHTML = '';
    if (i >= rounds.length) { api.finish(); return; }
    const r = rounds[i];
    const scene = el('div', 'scene stack quiz');
    root.appendChild(scene);
    render(scene, r, i);
    const items = shuffle(r.options.map((o, k) => ({ text: o, ok: k === 0 })));
    options(scene, items, (it, b, list) => {
      list.querySelectorAll('.opt').forEach(o => { if (o !== b) o.classList.add('dim'); });
      if (it.ok) { b.classList.add('right'); SFX.ok(); award(100); hooks.onCorrect && hooks.onCorrect(r, i); }
      else { b.classList.add('wrong'); const dead = hit(); if (dead) { later(() => attentionLost(() => { i = 0; hooks.onReset && hooks.onReset(); api.start(); }), 500); return; } }
      later(() => {
        list.querySelectorAll('.opt.dim').forEach(o => o.remove());
        scene.querySelectorAll(':scope > .label').forEach(n => n.remove());
        feedback(scene, it.ok, it.ok ? r.yes : r.no, () => { if (it.ok) i++; step(); }, it.ok ? 'Next' : 'Again');
      }, 350);
    });
  };
  step();
}

/* ---------- stages ---------- */
const STAGES = [
{
  name: 'The gap', blurb: 'Every purchase starts with a gap. Find the desire under the purchase.',
  intro: [
    'A founder walks in. "We need a better content strategy," he says.',
    'That is the purchase. It is not the desire. Keep asking "why does that matter?" until you hit the thing he actually wants.',
    'Pick the rung under each rung. Sideways steps cost attention.',
  ],
  lesson: [
    '"Content strategy" is the purchase. Being known, trusted and chosen is the desire.',
    'Market the purchase and you sound generic. Speak to the desire and the customer pays attention.',
    'The product sits between the life they have and the life they want. Marketing makes the gap visible.',
  ],
  play(root, api) {
    const rungs = [
      { options: ['To become visible.', 'To keep the content calendar full.', 'Because competitors post every day.'], no: 'Sideways. That describes more content, not why content matters to him.' },
      { options: ['So prospects recognise them.', 'So the brand looks bigger than it is.', 'So the team has something to share.'], no: 'Not deeper. Who needs to see it, and what changes when they do?' },
      { options: ['So sales conversations begin warm.', 'So the website gets more traffic.', 'So they can finally hire a marketer.'], no: 'Traffic is a vehicle number. What changes in the room when a prospect already knows you?' },
      { options: ['So the business can grow.', 'So they win an industry award.', 'So they can raise prices next year.'], no: 'Closer, but that is a side effect. Why does a warm conversation matter to him?' },
      { options: ['Because the business has been plateaued for two years.', 'Because growth is always good.', 'Because the board asked for a plan.'], no: 'That is a slogan or an excuse, not the pain he wakes up with.' },
      { options: ['Because they have no proper acquisition strategy.', 'Because their logo looks dated.', 'Because they need more followers.'], no: 'Followers and logos are vehicles again. What is the structural reason the business stalled?' },

      { t: 'Explain the steps.', p: 0, d: 0, x: -2, why: 'They can see the path. Distance collapses.' },
      { t: 'Proof from someone like them.', p: 0, d: 0, x: -2, why: 'Believable for someone like me. Distance collapses.' },

      { t: 'List fourteen features.', p: 0, d: 0, x: 1, why: 'Trap. More to decode. The gap looks wider.' },
      { t: 'Bigger headline. A gradient.', p: 0, d: 0, x: 0, why: 'Trap. Prettier is not more relevant. Nothing moved.' },

    const PLANKS = 5;

      clearTimers(); root.innerHTML = '';
      const scene = el('div', 'scene stack bridge-play'); root.appendChild(scene);
      const st = { p: 0, d: 0, x: 3, picks: 0, planks: 0, used: new Set() };
      const sea = el('div', 'sea');
      sea.innerHTML = `<div class="isle now"><div class="lab ui">Now</div></div><div class="isle after"><div class="lab ui">After</div></div><div class="deck"><i class="rail"></i></div><div class="walker">${SPR.person}</div>`;

      const hand = el('div', 'cards body'); scene.appendChild(hand);

        const deck = $('.deck', sea);
        deck.querySelectorAll('.span').forEach(p => p.remove());
        const shown = complete ? PLANKS : st.planks;
        const rail = $('.rail', deck);
        rail.style.width = shown ? (shown * 100 / PLANKS) + '%' : '0';
        for (let i = 0; i < shown; i++) {
          const span = el('div', 'span');

          span.style.width = (100 / PLANKS) + '%';

          }
        }
      }
    };
    start();
  },

    ];
    quizStage(rounds, (scene, r) => {
      const c = el('div', 'panel body'); c.textContent = r.who; scene.appendChild(c);
    }, root, api);
  },
},
];

function playUrl(tag, score) {
  const base = /^https?:/.test(location.protocol) ? location.href.split('#')[0].replace(/\/$/, '') : 'https://the-buyer.vercel.app';
  return tag && score != null ? `${base}/#beat=${encodeURIComponent(tag)}-${score}` : base;
}
function uniqueBest(rows) {
  const map = new Map();
  (rows || []).forEach(r => {
    if (!r || !r.tag) return;
    const prev = map.get(r.tag);
    if (!prev || r.score > prev.score || (r.score === prev.score && r.mistakes < prev.mistakes)) map.set(r.tag, r);
  });
  return [...map.values()].sort((a, b) => b.score - a.score || a.mistakes - b.mistakes).slice(0, 50);
}
function localBoard() { try { return JSON.parse(localStorage.getItem(LOCAL_BOARD) || '[]'); } catch (e) { return []; } }
function writeLocalBoard(rows) { try { localStorage.setItem(LOCAL_BOARD, JSON.stringify(rows.slice(0, 50))); } catch (e) {} }
function makeTweet(rank, score, tag, place, total) {
  const url = playUrl(tag, score);
  const placed = place && total ? ` ${place} of ${total} on the board.` : '';
  let t = `I ranked ${rank.toUpperCase()} in THE BUYER (${fmtTweet(score)} pts) by @emrreguney, from @leonabboud's article.${placed}\n\nLesson: The vehicle comes last. Marketing begins inside another person's mind.${url ? '\n\nPlay: ' + url : ''}`;
  if (t.length > 280) t = `I ranked ${rank.toUpperCase()} in THE BUYER (${fmtTweet(score)} pts) by @emrreguney, from @leonabboud's article.${placed}\n\nPlay: ${url}`;
  return t;
}
function paintBoard(node, rows, tag) {
  const top = (rows || []).slice(0, 5);
  if (!top.length) { node.innerHTML = '<div class="tiny">No scores yet. You are first.</div>'; return; }
  node.innerHTML = top.map((r, i) => `<div class="row${r.tag === tag ? ' me' : ''}"><span>${i + 1}</span><span>${r.tag}</span><span>${fmt(r.score)}</span></div>`).join('');
}
async function postBoard(you) {
  const local = uniqueBest(localBoard().concat([you]));
  writeLocalBoard(local);
  try {
    const r = await fetch('/api/board', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(you) });
    if (!r.ok) throw new Error('bad');
    return await r.json();
  } catch (err) {
    const idx = local.findIndex(x => x.tag === you.tag);
    return { rows: local.slice(0, 8), place: idx >= 0 ? idx + 1 : local.length, total: local.length, you };
  }
}

SCREENS.result = () => {
  setHud(null);
  G.elapsed = Math.round((Date.now() - (G.startedAt || Date.now())) / 1000);
  if (G.score > G.best) { G.best = G.score; save(); }
  const rank = G.mistakes <= 2 ? RANKS[0] : G.mistakes <= 6 ? RANKS[1] : G.mistakes <= 12 ? RANKS[2] : RANKS[3];
  const line = G.mistakes <= 2 ? 'You spoke to the desire, not the purchase.' : G.mistakes <= 6 ? 'You are close. Keep speaking to the life they want.' : G.mistakes <= 12 ? 'You copied what you could see. Look underneath.' : 'They did not understand. Say it in plain words and try again.';
  const good = G.mistakes <= 6;
  const showBoard = tag => {
    G.tag = tag; save();
    const you = { tag, score: G.score, mistakes: G.mistakes, rank, elapsed: G.elapsed };
    const s = el('div', 'scene stack');
    s.innerHTML = `
      <div style="display:flex;gap:6px;align-items:stretch">
        <div class="portrait ${good ? 'nod' : 'shake'}" style="position:static;flex:0 0 64px"><img alt="The buyer" src="${good ? ART.buyerYes : ART.buyerNo}"></div>
        <div class="panel body" style="flex:1">
          <div class="rank">${rank}</div>
          <div style="margin-top:3px">${line}</div>
          <div class="row" style="margin-top:4px;justify-content:space-between"><span class="ui">Score <span style="color:var(--deep)">${fmt(G.score)}</span></span><span class="tiny">${tag}</span></div>
        </div>
      </div>
      <div class="panel dark body">
        <div class="label" style="color:var(--amber);margin-bottom:3px">Board</div>
        <div id="board" class="board"></div>
        <div id="place" class="tiny" style="margin-top:3px;color:var(--paper)">Posting…</div>
      </div>
      <div class="row" style="justify-content:space-between">
        <button class="btn" id="share">Share on X</button><button class="btn ghost" id="copy">Copy</button><button class="btn ghost" id="again">Again</button>
      </div>`;
    view.innerHTML = '';
    view.appendChild(el('div', 'ground')); view.appendChild(el('div', 'horizon'));
    view.appendChild(s);
    paintBoard($('#board', s), uniqueBest(localBoard().concat([you])), tag);
    let tweet = makeTweet(rank, G.score, tag);
    G._tweet = tweet;
    const bindShare = () => {
      $('#share', s).addEventListener('click', () => { SFX.ok(); window.open('https://x.com/intent/post?text=' + encodeURIComponent(G._tweet), '_blank', 'noopener'); });
      $('#copy', s).addEventListener('click', async e => {
        SFX.ok(); try { await navigator.clipboard.writeText(G._tweet); e.target.textContent = 'Copied'; later(() => e.target.textContent = 'Copy', 1200); } catch (err) { e.target.textContent = 'Failed'; }
      });
      $('#again', s).addEventListener('click', () => { SFX.ok(); G.unlocked = 0; save(); go('title'); });
      bindKeys([$('#share', s), $('#copy', s), $('#again', s)]);
    };
    bindShare();
    postBoard(you).then(data => {
      const rows = data.rows || [];
      paintBoard($('#board', s), rows, tag);
      const place = data.place || 1, total = data.total || rows.length || 1;
      $('#place', s).textContent = total <= 1 || place === 1 ? `First of ${total} on the board.` : `You are ${place} of ${total}.`;
      tweet = makeTweet(rank, G.score, tag, place, total);
      G._tweet = tweet;
    }).catch(() => { $('#place', s).textContent = 'This device only. Share to compare.'; });
  };
  const askTag = () => {
    const s = el('div', 'scene stack');
    s.innerHTML = `
      <div class="panel body">
        <div class="label" style="margin-bottom:4px">Your name</div>
        Up to ${TAG_MAX} letters. Then you go on the board.
      </div>
      <input class="name-in" id="name" maxlength="${TAG_MAX}" autocomplete="off" spellcheck="false" inputmode="text" aria-label="Your name" value="${cleanTag(G.tag)}" placeholder="YOUR NAME">
      <div class="row right-al"><button class="btn" id="lock">Enter board</button></div>`;
    view.appendChild(el('div', 'ground')); view.appendChild(el('div', 'horizon'));
    view.appendChild(s);
    const input = $('#name', s);
    const typeTag = () => {
      const cur = input.selectionStart;
      const prev = input.value;
      const next = cleanTag(prev);
      if (prev === next) return;
      const kept = prev.slice(0, cur).replace(/[^a-zA-Z]/g, '').length;
      input.value = next;
      input.setSelectionRange(kept, kept);
    };
    const lock = () => {
      const tag = cleanTag(input.value) || 'YOU';
      SFX.ok();
      showBoard(tag);
    };
    $('#lock', s).addEventListener('click', lock);
    input.addEventListener('input', typeTag);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); lock(); }
    });
    later(() => input.focus(), 0);
    bindKeys([$('#lock', s)]);
  };
  view.innerHTML = '';
  askTag();
};

/* ---------- boot ---------- */
load(); drawMute();
if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) document.body.classList.add('reduced');

/* read-only debug surface for QA */
window.BUYER = {
  get state() { return { screen: G.screen, stage: G.stage, hearts: G.hearts, score: G.score, mistakes: G.mistakes, unlocked: G.unlocked, best: G.best, tag: G.tag, tweet: G._tweet || null }; },
  stages: STAGES.map(s => ({ name: s.name, blurb: s.blurb })),
  go: name => go(name),
  playStage: (n, opts) => { G.stage = n; G.unlocked = Math.max(G.unlocked, n); G.skipTalk = !!(opts && opts.skipTalk); go('stage'); },
};
window.GRUNT = window.BUYER;

function boot() {
  const hash = String(location.hash || '');
  const beat = hash.match(/beat=([A-Za-z]{1,12})-(\d+)/);
  if (beat) G.challenge = { tag: beat[1].toUpperCase(), score: +beat[2] };
  const m = hash.match(/stage=(\d+)/);
  if (m) window.BUYER.playStage(+m[1], { skipTalk: true });
  else go('title');
}
if (document.fonts) document.fonts.ready.then(boot).catch(boot);
else boot();
})();
</script>
</body>
