<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GRUNT QUEST</title>
<meta name="description" content="A seven minute pixel game that teaches the foundation of marketing. Based on Leon Abboud's article.">
<meta property="og:title" content="GRUNT QUEST">
<meta property="og:description" content="Become so good at marketing your competition thinks you're cheating. A seven minute pixel game based on Leon Abboud's article.">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:image" content="https://emreguney.github.io/grunt-quest/assets/screenshot-title.png">
<meta property="og:url" content="https://emreguney.github.io/grunt-quest/">
<meta name="theme-color" content="#1c1a2e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%231c1a2e'/%3E%3Cpath d='M1 1h2v1h2V1h2v3H6v1H5v1H4v1H3V6H2V5H1z' fill='%23d9463b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c1a2e; --paper:#f7efd6; --sand:#e6c98a; --amber:#e08a2c; --teal:#2f9d8a; --deep:#1f5f58;
  --acid:#9fbf1f; --red:#d9463b; --mute:#b9a97a; --white:#fffaf0; --shade:#c9ad74;
  --ui:'Press Start 2P',monospace; --body:'Pixelify Sans','Press Start 2P',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0e0d15;overflow:hidden;color:var(--ink)}
body{font-family:var(--body);-webkit-font-smoothing:none;font-smooth:never}
::selection{background:var(--amber);color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
button:focus-visible,a:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
img,svg{image-rendering:pixelated;image-rendering:crisp-edges;display:block}

#stage-wrap{position:fixed;inset:0;display:grid;place-items:center}
#screen{position:relative;width:256px;height:240px;overflow:hidden;transform-origin:0 0;user-select:none;-webkit-user-select:none;outline:3px solid #2b2942;
  background:var(--sand) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32' shape-rendering='crispEdges'><rect width='32' height='32' fill='%23e6c98a'/><rect x='5' y='7' width='2' height='1' fill='%23d9b977'/><rect x='21' y='3' width='1' height='1' fill='%23d9b977'/><rect x='14' y='19' width='2' height='1' fill='%23d9b977'/><rect x='27' y='25' width='1' height='1' fill='%23d9b977'/><rect x='3' y='27' width='1' height='1' fill='%23d9b977'/></svg>")}
#screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='2' height='2' viewBox='0 0 2 2' shape-rendering='crispEdges'><rect x='1' y='0' width='1' height='2' fill='rgba(28,26,46,0.045)'/><rect x='0' y='1' width='1' height='1' fill='rgba(28,26,46,0.045)'/></svg>")}

/* type */
.ui{font-family:var(--ui);font-size:8px;line-height:10px;text-transform:uppercase;letter-spacing:0}
.body{font-family:var(--body);font-size:10px;line-height:11px;font-weight:500}
.tiny{font-family:var(--ui);font-size:6px;line-height:8px;text-transform:uppercase}

/* panel: paper with double ink frame */
.panel{position:relative;background:var(--paper);border:2px solid var(--ink);padding:6px 6px;box-shadow:inset 0 0 0 1px var(--white)}
.panel.dark{background:var(--ink);color:var(--paper);box-shadow:inset 0 0 0 1px var(--deep)}

/* hud */
#hud{position:absolute;top:0;left:0;right:0;height:14px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 4px;z-index:5;border-bottom:1px solid var(--deep)}
#hud .hearts{display:flex;gap:1px}
#hud .hearts svg{width:8px;height:8px}
#hud .score{color:var(--amber)}
#hud.hidden{display:none}

/* content root */
#view{position:absolute;inset:0}
#view.with-hud{top:14px}
.ground{position:absolute;left:0;right:0;bottom:0;height:20px;background:var(--deep) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='20' viewBox='0 0 16 20' shape-rendering='crispEdges'><rect width='16' height='20' fill='%231f5f58'/><rect x='2' y='2' width='1' height='3' fill='%232f9d8a'/><rect x='3' y='1' width='1' height='4' fill='%232f9d8a'/><rect x='10' y='6' width='1' height='3' fill='%232f9d8a'/><rect x='11' y='5' width='1' height='4' fill='%232f9d8a'/><rect x='6' y='12' width='1' height='3' fill='%232f9d8a'/><rect x='13' y='14' width='1' height='2' fill='%232f9d8a'/></svg>") repeat-x}
.horizon{position:absolute;left:0;right:0;bottom:20px;height:2px;background:var(--ink)}

/* buttons / options */
.opts{display:flex;flex-direction:column;gap:3px}
.opt{position:relative;display:flex;gap:4px;align-items:flex-start;width:100%;background:var(--paper);border:2px solid var(--ink);padding:3px 5px 3px 4px;color:var(--ink)}
.opt .k{flex:0 0 8px;font-family:var(--ui);font-size:8px;line-height:11px;color:var(--deep)}
.opt .t{flex:1}
.opt::before{content:"";position:absolute;left:-8px;top:50%;margin-top:-4px;width:4px;height:8px;background:var(--ink);clip-path:polygon(0 0,100% 50%,0 100%);opacity:0}
.opt:hover,.opt:focus-visible,.opt.sel{background:var(--white);box-shadow:inset 0 0 0 1px var(--ink)}
.opt:hover::before,.opt:focus-visible::before,.opt.sel::before{opacity:1}
.opt.right{background:var(--teal);color:var(--white);box-shadow:none}
.opt.right .k{color:var(--white)}
.opt.wrong{background:var(--red);color:var(--white);box-shadow:none}
.opt.wrong .k{color:var(--white)}
.opt.dim{opacity:.45}
.opt[disabled]{cursor:default}
.opt[disabled]::before{opacity:0}
.opts,.msgs{padding-left:8px}
.btn{display:inline-flex;align-items:center;gap:4px;background:var(--amber);color:var(--ink);border:2px solid var(--ink);padding:3px 6px;font-family:var(--ui);font-size:8px;line-height:10px;text-transform:uppercase}
.btn:hover,.btn:focus-visible{background:var(--ink);color:var(--amber)}
.btn.ghost{background:var(--paper)}
.btn.ghost:hover,.btn.ghost:focus-visible{background:var(--ink);color:var(--paper)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.right-al{justify-content:flex-end}

/* dialog */
.dialog{position:absolute;left:6px;right:6px;bottom:6px;min-height:52px}
.dialog .txt{min-height:33px}
.dialog .more{position:absolute;right:5px;bottom:3px;width:8px;height:8px;animation:bob 0.6s steps(2) infinite}
.dialog .who{position:absolute;top:-9px;left:4px;background:var(--ink);color:var(--paper);padding:1px 3px}
@keyframes bob{50%{transform:translateY(1px)}}
.portrait{position:absolute;width:64px;height:64px;border:2px solid var(--ink);background:var(--sand);box-shadow:inset 0 0 0 1px var(--white)}
.portrait img{width:100%;height:100%}
.portrait.shake{animation:shake .3s steps(3)}
@keyframes shake{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.portrait.nod{animation:nod .35s steps(2)}
@keyframes nod{50%{transform:translateY(2px)}}

/* title */
#title{position:absolute;inset:0;background:#e08a2c}
#title img.art{position:absolute;inset:0;width:256px;height:240px}
#title h1{position:absolute;top:22px;left:0;right:0;text-align:center;font-family:var(--ui);font-size:20px;line-height:22px;color:var(--paper);text-shadow:2px 2px 0 var(--ink);text-transform:uppercase}
#title h1 span{display:block}
#title .tag{position:absolute;top:70px;left:20px;right:20px;text-align:center;color:var(--ink);font-weight:700}
#title .start{position:absolute;left:120px;right:6px;top:104px;display:flex;justify-content:center}
#title .start .btn{animation:blink 1.2s steps(1) infinite}
@keyframes blink{0%,74%{opacity:1}75%,100%{opacity:0}}
#title .credit{position:absolute;left:0;right:0;bottom:0;padding:3px 0 2px;text-align:center;color:var(--paper);background:var(--ink)}
#title .credit a{color:var(--amber)}
#title .cont{position:absolute;left:120px;right:6px;top:124px;display:flex;justify-content:center}

/* map */
.map{position:absolute;inset:0}
.map .node{position:absolute;width:18px;height:18px;border:2px solid var(--ink);background:var(--paper);display:grid;place-items:center;font-family:var(--ui);font-size:8px;line-height:8px;box-shadow:inset 0 0 0 1px var(--white)}
.map .node.done{background:var(--teal);color:var(--white)}
.map .node.locked{background:var(--shade);color:var(--mute)}
.map .node.cur{background:var(--amber);animation:pulse 1s steps(2) infinite}
.map .node.locked svg{width:8px;height:8px}
@keyframes pulse{50%{transform:translateY(-1px)}}
.map .path{position:absolute;inset:0;pointer-events:none}
.map .sign{position:absolute;left:6px;top:6px}

/* generic stage layout */
.stage-root{position:absolute;inset:0}
.scene{position:absolute;left:6px;right:6px;top:6px}
.stack{display:flex;flex-direction:column;gap:6px}
.label{font-family:var(--ui);font-size:8px;line-height:10px;text-transform:uppercase}
.center{text-align:center}
.spacer{height:4px}

/* ladder */
.ladder{position:absolute;left:6px;right:6px;top:6px}
.rung{background:var(--ink);color:var(--paper);padding:1px 4px;margin-left:calc(var(--i) * 6px)}
.rung.first{background:var(--paper);color:var(--ink);border:2px solid var(--ink);box-shadow:inset 0 0 0 1px var(--white)}

/* doors: three arched cave mouths in a rock wall */
.wall{position:relative;height:84px;background:var(--deep);border:2px solid var(--ink);display:flex;gap:10px;justify-content:center;align-items:flex-end;padding:0 6px;overflow:hidden;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='16' viewBox='0 0 24 16' shape-rendering='crispEdges'><rect width='24' height='16' fill='%231f5f58'/><rect x='0' y='7' width='24' height='1' fill='%2317463f'/><rect x='0' y='15' width='24' height='1' fill='%2317463f'/><rect x='11' y='0' width='1' height='7' fill='%2317463f'/><rect x='3' y='8' width='1' height='7' fill='%2317463f'/><rect x='17' y='8' width='1' height='7' fill='%2317463f'/></svg>")}
.door{width:66px;height:70px;position:relative;background:var(--ink);border:2px solid var(--ink);border-bottom:0;border-radius:33px 33px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:5px;color:var(--paper);gap:4px}
.door::before{content:"";position:absolute;inset:2px 2px 0 2px;border-radius:31px 31px 0 0;background:#141326}
.door>*{position:relative}
.door .k{position:absolute;top:8px;left:50%;margin-left:-4px;color:var(--amber)}
.door .ico{width:16px;height:16px}
.door .ico svg{width:16px;height:16px}
.door .lab{font-family:var(--ui);font-size:8px;line-height:8px;text-transform:uppercase}
.door:hover::before,.door:focus-visible::before{background:var(--deep)}
.door:hover,.door:focus-visible{outline:none;border-color:var(--paper)}
.door.right::before{background:var(--teal)}
.door.wrong::before{background:var(--red)}
.timer{height:8px;border:2px solid var(--ink);background:var(--paper);position:relative}
.timer i{position:absolute;left:0;top:0;bottom:0;background:var(--amber)}
.timer.low i{background:var(--red)}
.item{min-height:26px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700}

/* filter */
.brain{display:flex;justify-content:space-between;align-items:center}
.brain svg{width:24px;height:24px}
.msgs{display:flex;flex-direction:column;gap:3px}
.msg{min-height:38px}

/* grunt */
.meter{display:flex;gap:2px}
.meter i{flex:1;height:8px;border:2px solid var(--ink);background:var(--paper)}
.meter i.on{background:var(--amber)}
.bubble{position:absolute;left:78px;top:6px;right:6px}
.bubble .panel{min-height:44px}
.grunt-say{position:absolute;left:0;top:70px;width:66px;text-align:center;color:var(--ink)}

/* bridge: a gorge with two ledges */
.sea{position:relative;height:48px;border:2px solid var(--ink);background:var(--deep);overflow:hidden;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='8' viewBox='0 0 16 8' shape-rendering='crispEdges'><rect width='16' height='8' fill='%231f5f58'/><rect x='2' y='5' width='4' height='1' fill='%232f9d8a'/><rect x='10' y='2' width='3' height='1' fill='%232f9d8a'/></svg>");background-position:0 26px;background-repeat:repeat-x}
.isle{position:absolute;bottom:0;height:28px;border-top:2px solid var(--ink);background:var(--sand) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='26' viewBox='0 0 16 26' shape-rendering='crispEdges'><rect width='16' height='26' fill='%23e6c98a'/><rect y='14' width='16' height='12' fill='%23c9ad74'/><rect x='2' y='14' width='3' height='1' fill='%23e6c98a'/><rect x='9' y='14' width='4' height='1' fill='%23e6c98a'/><rect x='4' y='18' width='1' height='4' fill='%237a4a2a'/><rect x='11' y='20' width='1' height='3' fill='%237a4a2a'/><rect x='0' y='24' width='16' height='2' fill='%237a4a2a'/></svg>") repeat-x}
.isle.now{left:0;width:56px}
.isle.after{right:0;width:56px}
.isle .lab{position:absolute;top:3px;left:0;right:0;text-align:center}
.plank{position:absolute;bottom:26px;height:4px;background:var(--amber);border:1px solid var(--ink);width:32px}
.walker{position:absolute;bottom:30px;left:44px;width:8px;height:12px}
.gauges{display:flex;gap:6px}
.gauge{flex:1}
.gauge .bar{height:8px;border:2px solid var(--ink);background:var(--paper);display:flex;gap:1px;padding:0}
.gauge .bar i{flex:1;background:transparent}
.gauge .bar i.on{background:var(--amber)}
.gauge.dist .bar i.on{background:var(--red)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.cards .opt{padding:2px 3px 2px 3px;min-height:20px;gap:3px}
.cards .opt::before{display:none}

/* result */
.rank{font-family:var(--ui);font-size:10px;line-height:12px;text-transform:uppercase;color:var(--ink);text-shadow:1px 1px 0 var(--amber)}
.method{display:grid;grid-template-columns:auto 1fr;gap:1px 6px}
.method b{font-family:var(--ui);font-size:6px;line-height:11px;color:var(--teal)}

.face{width:24px;height:24px;flex:0 0 24px;border:1px solid var(--ink);background:var(--sand)}

/* toast */
.toast{position:absolute;left:6px;right:6px;top:20px;text-align:center;z-index:6}

/* mute */
#mute{position:absolute;right:2px;top:2px;width:10px;height:10px;z-index:7;display:grid;place-items:center;background:var(--ink)}
#mute svg{width:8px;height:8px}

.fade{animation:fade .25s steps(4)}
@keyframes fade{from{opacity:0}}
.reduced *{animation:none!important}
</style>
</head>
<body>
<div id="stage-wrap">
  <div id="screen">
    <div id="hud" class="ui hidden"><span class="name"></span><span class="hearts"></span><span class="score"></span></div>
    <div id="view"></div>
    <button id="mute" aria-label="Toggle sound" title="Sound (M)"></button>
  </div>
</div>

/* ---------- scaling ---------- */

  screen.style.transform = `scale(${s})`;

/* ---------- dialog (typewriter) ---------- */
function dialog(root, pages, opts, done) {
  opts = opts || {};
  const box = el('div', 'dialog panel body');
  if (opts.who) box.appendChild(el('span', 'who tiny', opts.who));
  const txt = el('div', 'txt'); box.appendChild(txt);
  const more = el('span', 'more', SPR.more); box.appendChild(more);
  root.appendChild(box);
  let i = 0, typing = null, full = false;
  function show() {
    const words = pages[i].split(' '); let n = 0; full = false; more.style.visibility = 'hidden'; txt.textContent = '';
    clearInterval(typing);
    typing = setInterval(() => {
      n++; txt.textContent = words.slice(0, n).join(' '); SFX.type();
      if (n >= words.length) { clearInterval(typing); full = true; more.style.visibility = 'visible'; }
    }, 55);
    G.timers.push(typing);
  }
  function advance() {
    if (!full) { clearInterval(typing); txt.textContent = pages[i]; full = true; more.style.visibility = 'visible'; return; }
    SFX.move(); i++;
    if (i < pages.length) show(); else { box.remove(); keyHandler = null; done && done(); }
  }
  box.addEventListener('click', advance);
  box.setAttribute('role', 'button'); box.tabIndex = 0;
  keyHandler = e => { if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight') { e.preventDefault(); advance(); } };
  show();
  return box;
}

/* options list with number keys */
function options(root, items, onPick, opts) {
  opts = opts || {};
  const list = el('div', opts.cls || 'opts body');

  items.forEach((it, idx) => {
    const b = el('button', 'opt');
    b.innerHTML = `<span class="k">${idx + 1}</span><span class="t">${it.text}</span>`;
    b.addEventListener('mouseenter', () => SFX.move());
    b.addEventListener('click', () => { if (locked) return; locked = true; list.querySelectorAll('.opt').forEach(o => o.disabled = true); onPick(it, b, list); });
    list.appendChild(b);
  });
  root.appendChild(list);
  keyHandler = e => { const n = parseInt(e.key, 10); if (n >= 1 && n <= items.length) { const b = list.children[n - 1]; if (b && !b.disabled) b.click(); } };
  return list;
}

/* helper: a stage that is a sequence of multiple-choice rounds */
function quizStage(rounds, render, root, api, hooks) {
  hooks = hooks || {};
  let i = 0;
  const step = () => {
    root.innerHTML = '';
    if (i >= rounds.length) { api.finish(); return; }
    const r = rounds[i];
    const scene = el('div', 'scene stack');
    root.appendChild(scene);
    render(scene, r, i);
    const items = shuffle(r.options.map((o, k) => ({ text: o, ok: k === 0 })));
    options(scene, items, (it, b, list) => {
      list.querySelectorAll('.opt').forEach(o => { if (o !== b) o.classList.add('dim'); });
      if (it.ok) { b.classList.add('right'); SFX.ok(); award(100); hooks.onCorrect && hooks.onCorrect(r, i); }
      else { b.classList.add('wrong'); const dead = hit(); if (dead) { later(() => attentionLost(() => { i = 0; hooks.onReset && hooks.onReset(); api.start(); }), 500); return; } }
      later(() => {
        list.querySelectorAll('.opt.dim').forEach(o => o.remove());
        feedback(scene, it.ok, it.ok ? r.yes : r.no, () => { if (it.ok) i++; step(); }, it.ok ? 'Next' : 'Again');
      }, 350);
    });
  };
  step();
}

  lesson: [
    'The brain does not ask how much work went into the campaign. It asks: does this matter to me?',
    'Relevance beats creativity. A plain sentence that names a painful problem stops someone. Jargon makes the brain do gymnastics. Filtered.',
  ],
  play(root, api) {
    const pairs = [
      ['Work leads faster and close more of them with our CRM.', 'Our CRM uses advanced LLM systems to accelerate pipeline velocity.'],
      ['Your competitors are becoming the trusted names in your category while you remain invisible.', 'Unlock the power of next-generation executive content.'],
      ['Hunt your prey faster with a bow that never breaks.', 'A cutting edge wood hunting apparatus with industry level precision and a three year warranty.'],
      ['Sleep through the night again.', 'Holistic wellness optimisation for the modern professional.'],
      ['Stop losing customers who forgot you exist.', 'Leveraging omnichannel engagement paradigms at scale.'],
      ['Know exactly where your money went this month.', 'An end to end platform for holistic financial empowerment.'],
    ];
    let i = 0, ads = 5000; const LIMIT = 8000;
    const step = () => {
      clearTimers(); root.innerHTML = '';
      if (i >= pairs.length) { api.finish(); return; }
      const p = pairs[i];
      const scene = el('div', 'scene stack'); root.appendChild(scene);
      const head = el('div', 'brain'); head.innerHTML = `${SPR.brain}<div class="ui" style="text-align:right">Ads today<br><span class="ads" style="color:var(--red)">${fmt(ads)}</span></div>`;
      scene.appendChild(head);
      const timer = el('div', 'timer', '<i></i>'); scene.appendChild(timer);
      const t0 = performance.now(); let done = false;
      const items = shuffle([{ text: p[0], ok: true }, { text: p[1], ok: false }]);
      const list = options(scene, items, (it, b, l) => pick(it, b, l), { cls: 'msgs body' });
      list.querySelectorAll('.opt').forEach(o => o.classList.add('msg'));
      const bar = $('i', timer), adsEl = $('.ads', head);
      every(() => {
        const left = Math.max(0, 1 - (performance.now() - t0) / LIMIT);
        bar.style.width = (left * 100) + '%'; if (left < 0.3) timer.classList.add('low');
        ads += 7; adsEl.textContent = fmt(ads);
        if (left <= 0 && !done) pick(null, null, list);
      }, 50);
      every(() => { const left = 1 - (performance.now() - t0) / LIMIT; if (left < 0.3 && left > 0 && !done) SFX.tick(); }, 500);
      function pick(it, b, l) {
        if (done) return; done = true; clearTimers();
        l.querySelectorAll('.opt').forEach(o => o.disabled = true);
        const ok = !!(it && it.ok);
        if (ok) { b.classList.add('right'); SFX.ok(); const bonus = Math.round(50 * Math.max(0, 1 - (performance.now() - t0) / LIMIT)); award(100 + bonus); }
        else {
          if (b) b.classList.add('wrong');
          l.querySelectorAll('.opt').forEach((o, k) => { if (items[k].ok) o.classList.add('right'); });
          const dead = hit(); if (dead) { later(() => attentionLost(() => { i = 0; api.start(); }), 500); return; }
        }
        const why = ok ? 'Survive or thrive. The brain let it through.' : (it ? 'Jargon. The brain had to translate it, so it filtered it out.' : 'Too slow. The scroll does not wait. Filtered.');
        later(() => feedback(scene, ok, why, () => { i++; step(); }), 300);
      }
    };
    step();
  },
},
{
  name: 'The grunt test', blurb: 'Boss. Explain a bow to a caveman. Four questions. No jargon survives.',
  intro: [
    'Me. I am the boss. I do not care about your features, your methodology, your credentials.',
    'I want four things. What do I get? How does it improve my life? What pain does it remove? Why should I trust you?',
    'Sell me a bow. If I have to decode the sentence, you have already lost.',
  ],
  lesson: [
    'Clear marketing does not make the customer perform the translation. It connects the product to an outcome they already want.',
    'Run every headline, offer and page through the grunt test. Can a stranger grunt in understanding within a few seconds?',
  ],
  play(root, api) {
    const qs = [
      { q: 'What do I get?', options: ['A bow that never breaks.', 'A precision hunting apparatus.', 'Access to our hunting platform.'], yes: 'Ugh. Bow. Never breaks. Got it.', no: 'Ugh? What is an apparatus? What is a platform? Ugg hungry, not curious.' },
      { q: 'How does it improve my life?', options: ['You hunt faster and eat every night.', 'It accelerates your hunting velocity.', 'It is trusted by the leading tribes.'], yes: 'Eat every night. Ugh! Yes.', no: 'Ugh? Velocity? Leading tribes? Ugg still does not know what changes for Ugg.' },
      { q: 'What pain does it remove?', options: ['No more snapped bows mid hunt.', 'It reduces equipment friction.', 'It comes with a three year warranty.'], yes: 'Snapped bow mid hunt. Ugg knows that pain. Ugh.', no: 'Ugh? A warranty is your feature. Friction is your word. Where is my pain?' },
      { q: 'Why should I trust you?', options: ['I fed my whole tribe with it last winter.', 'We are industry level.', 'Our methodology is cutting edge.'], yes: 'Whole tribe. Last winter. Ugg believes you.', no: 'Ugh? Industry level of what? Show Ugg the proof, not the adjective.' },
    ];
    let i = 0;
    const step = () => {
      root.innerHTML = '';
      if (i >= qs.length) {
        const scene = el('div', 'scene stack'); root.appendChild(scene);
        scene.appendChild(portrait('yes', 'nod'));
        const b = el('div', 'panel body', `<div class="label" style="color:var(--deep);margin-bottom:3px">The message</div>"A bow that never breaks. Hunt faster, eat every night, no snapped bows mid hunt. I fed my whole tribe with it last winter."`);
        b.style.cssText = 'position:absolute;left:72px;right:0;top:0'; scene.appendChild(b);
        const meter = el('div', 'meter'); meter.style.cssText = 'position:absolute;left:0;right:0;top:70px'; meter.innerHTML = '<i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i>'; scene.appendChild(meter);
        const nx = el('div', 'row right-al'); nx.style.cssText = 'position:absolute;right:0;top:84px'; nx.innerHTML = '<button class="btn">Ugh!</button>'; scene.appendChild(nx);
        $('.btn', nx).addEventListener('click', () => api.finish());
        keyHandler = e => { if (e.key === 'Enter' || e.key === ' ') api.finish(); };
        return;
      }
      const q = qs[i];
      const scene = el('div', 'scene'); root.appendChild(scene);
      const por = portrait(); scene.appendChild(por);
      const bub = el('div', 'bubble'); bub.innerHTML = `<div class="panel body"><div style="font-weight:700;font-size:11px">${q.q}</div><div class="tiny" style="margin-top:4px;color:var(--deep)">Question ${i + 1} of 4</div></div>`; scene.appendChild(bub);
      const meter = el('div', 'meter'); meter.style.cssText = 'position:absolute;left:78px;right:0;top:56px';
      meter.innerHTML = qs.map((_, k) => `<i class="${k < i ? 'on' : ''}"></i>`).join(''); scene.appendChild(meter);
      const say = el('div', 'grunt-say ui', ''); scene.appendChild(say);
      const wrap = el('div', ''); wrap.style.cssText = 'position:absolute;left:0;right:0;top:80px'; scene.appendChild(wrap);
      const items = shuffle(q.options.map((o, k) => ({ text: o, ok: k === 0 })));
      options(wrap, items, (it, b, list) => {
        list.querySelectorAll('.opt').forEach(o => { if (o !== b) o.classList.add('dim'); });
        if (it.ok) { b.classList.add('right'); SFX.ok(); award(100); setMood(por, 'yes'); say.textContent = 'Ugh!'; meter.children[i].classList.add('on'); }
        else { b.classList.add('wrong'); setMood(por, 'no'); say.textContent = 'Ugh?'; const dead = hit(); if (dead) { later(() => attentionLost(() => { i = 0; api.start(); }), 500); return; } }
        later(() => feedback(wrap, it.ok, it.ok ? q.yes : q.no, () => { if (it.ok) i++; step(); }, it.ok ? 'Next' : 'Again'), 350);
      });
    };
    step();
  },
},
{
  name: 'The bridge', blurb: 'Pain, desire, distance. Build a bridge the customer believes they can cross.',
  intro: [
    'Three forces decide a purchase. How painful is now? How badly do they want after? How far apart do the two feel?',
    'Two ledges. Now and after. Get me across in five moves. Fill pain and desire to three. Bring distance down to zero. Some moves are traps.',
  ],
  lesson: [
    'Strong marketing increases the contrast between the customer\'s current reality and the one they want.',
    'Then it makes the path between them feel credible. Believable. Understandable. Manageable. That is where the mechanism comes in.',
  ],
  play(root, api) {
    const GOOD = [
      { t: 'Name what it costs them monthly.', p: 2, d: 0, x: 0, why: 'Pain gets a number. It is real now.' },
      { t: 'Name the moment it got urgent.', p: 1, d: 0, x: 0, why: 'A specific moment beats a demographic.' },
      { t: 'Show life after, in one picture.', p: 0, d: 2, x: 0, why: 'They can picture the outcome. Desire rises.' },
      { t: 'Promise the change and say how.', p: 0, d: 1, x: -1, why: 'A promise with a mechanism. Closer and more wanted.' },
      { t: 'Explain the steps in plain words.', p: 0, d: 0, x: -2, why: 'They can see the path. Distance collapses.' },
      { t: 'Proof from someone like them.', p: 0, d: 0, x: -2, why: 'Believable for someone like me. Distance collapses.' },
    ];
    const TRAPS = [
      { t: 'List all fourteen features.', p: 0, d: 0, x: 1, why: 'Trap. More to decode. The gap looks wider.' },
      { t: 'Bigger headline. Add a gradient.', p: 0, d: 0, x: 0, why: 'Trap. Prettier is not more relevant. Nothing moved.' },
      { t: 'Call it cutting edge.', p: 0, d: 0, x: 1, why: 'Trap. Adjectives are not proof. Further away.' },
    ];
    const start = () => {
      clearTimers(); root.innerHTML = '';
      const scene = el('div', 'scene stack'); root.appendChild(scene);
      const st = { p: 0, d: 0, x: 3, picks: 0, used: new Set() };
      const sea = el('div', 'sea'); sea.innerHTML = `<div class="isle now"><div class="lab ui">Now</div></div><div class="isle after"><div class="lab ui">After</div></div><div class="walker">${SPR.ugg}</div>`;
      scene.appendChild(sea);
      const gauges = el('div', 'gauges body'); scene.appendChild(gauges);
      const hint = el('div', 'tiny row', `<span style="flex:1;color:var(--deep)">Pain 3. Desire 3. Distance 0.</span><span class="left">5 left</span>`); scene.appendChild(hint);
      const hand = el('div', 'cards body'); scene.appendChild(hand);
      const draw = () => {
        gauges.innerHTML = [['Pain', st.p, ''], ['Desire', st.d, ''], ['Distance', st.x, 'dist']].map(([n, v, c]) => `<div class="gauge ${c}"><div class="tiny" style="margin-bottom:1px">${n} ${v}</div><div class="bar">${[0, 1, 2].map(k => `<i class="${k < v ? 'on' : ''}"></i>`).join('')}</div></div>`).join('');
        sea.querySelectorAll('.plank').forEach(p => p.remove());
        for (let k = 0; k < 3 - st.x; k++) { const pl = el('div', 'plank'); pl.style.left = (54 + k * 30) + 'px'; sea.appendChild(pl); }
        $('.left', hint).textContent = `${5 - st.picks} left`;
      };
      draw();
      const cards = shuffle(GOOD.concat(shuffle(TRAPS).slice(0, 2)));
      const btns = cards.map((c, k) => {
        const b = el('button', 'opt'); b.innerHTML = `<span class="k">${k + 1}</span><span class="t">${c.t}</span>`;
        b.addEventListener('mouseenter', () => SFX.move());
        b.addEventListener('click', () => choose(k, b));
        hand.appendChild(b); return b;
      });
      keyHandler = e => { const n = parseInt(e.key, 10); if (n >= 1 && n <= btns.length && !btns[n - 1].disabled) btns[n - 1].click(); };
      let toast = null;
      function choose(k, b) {
        const c = cards[k]; if (st.used.has(k)) return;
        st.used.add(k); b.disabled = true; st.picks++;
        st.p = Math.min(3, st.p + c.p); st.d = Math.min(3, st.d + c.d); st.x = Math.max(0, Math.min(3, st.x + c.x));
        const good = c.p + c.d - c.x > 0;
        b.classList.add(good ? 'right' : 'wrong'); good ? SFX.ok() : SFX.bad();
        if (toast) toast.remove();
        toast = el('div', 'toast panel body fade', c.why); toast.style.top = '58px'; root.appendChild(toast);
        later(() => { if (toast) { toast.remove(); toast = null; } }, 1500);
        draw();
        if (st.picks >= 5) {
          btns.forEach(o => o.disabled = true); keyHandler = null;
          const win = st.p >= 3 && st.d >= 3 && st.x <= 0;
          if (win) {
            award(500); SFX.ok();
            const w = $('.walker', sea); let x = 40; const walk = every(() => { x += 4; w.style.left = x + 'px'; if (x >= 196) clearInterval(walk); }, 60);
            later(() => { hand.remove(); feedback(scene, true, 'The customer crossed. Pain and desire high, distance low. The bridge held.', () => api.finish(), 'Next'); }, 1500);
          } else {
            const dead = hit();
            const miss = [st.p < 3 ? 'pain too low' : null, st.d < 3 ? 'desire too low' : null, st.x > 0 ? 'distance too far' : null].filter(Boolean).join(', ');
            if (dead) { later(() => attentionLost(() => api.start()), 500); return; }
            later(() => { hand.remove(); feedback(scene, false, `The bridge fell: ${miss}. Traps widen the gap. Try a different hand.`, () => start(), 'Rebuild'); }, 600);
          }
        }
      }
    };
    start();
  },
},
{
  name: 'The mechanism', blurb: 'A promise says where. A mechanism says how. Spot the mechanism.',
  intro: [
    'A promise tells the customer where you can take them. A mechanism explains how you will get them there.',
    'The mechanism reduces uncertainty. It gives them something concrete to evaluate. Three statements. Find the how.',
  ],
  lesson: [
    'A strong mechanism answers: why did their previous approach fail? What does this do differently? Why should that produce a better result? What will they need to do?',
    'It does not need a clever name. Clarity matters more. If you cannot explain the mechanism, you have an offer problem, not a promotion problem.',
  ],
  play(root, api) {
    const rounds = [
      { who: 'Content service for founders', options: ['We interview you once a week, turn your expertise into daily content, distribute it where your customers already read, and connect each topic to an offer.', 'Grow your business faster than you ever thought possible, without lifting a finger or writing a word.', 'The growth partner chosen by the most ambitious founders in your category, year after year, for a reason.'], yes: 'Steps. Inputs. Outputs. You can evaluate it before you buy.', no: 'That tells you where or who. It does not tell you how. Nothing to evaluate.' },
      { who: 'A sleep coach', options: ['We track your sleep for two weeks, find the three habits breaking it, and replace them one at a time with a check in every Sunday.', 'Wake up rested every single morning and take back the energy you have been missing for years.', 'Trusted by ten thousand exhausted professionals who finally decided enough was enough.'], yes: 'You can see the method and what it asks of you. Believable.', no: 'A promise or a claim. Where is the method? Why would it work for you when the last thing did not?' },
      { who: 'A bow maker', options: ['We cut the wood in winter when it is dense, dry it for a full year, and draw every bow a hundred times before it leaves the workshop.', 'Never miss a hunt again with the bow that changes everything about how your tribe eats.', 'The strongest bow in the valley, sworn by every hunter who has ever held one in their hands.'], yes: 'Dense wood, a year of drying, a hundred test draws. Now "never breaks" is believable.', no: 'Big words. No how. The caveman grunts in confusion.' },
    ];
    quizStage(rounds, (scene, r) => {
      scene.appendChild(el('div', 'body', `<b style="font-weight:700">${r.who}.</b> Which one is the mechanism?`));
    }, root, api);
  },
},
{
  name: 'Positioning', blurb: 'The same service means different things in different minds. Choose the position.',
  intro: [
    'Positioning decides what your product means inside the customer\'s mind. One service can promise more posts, more attention, authority, a shorter sales cycle.',
    'The strongest position depends on what the customer already cares about. Read the customer. Then choose.',
  ],
  lesson: [
    'You cannot force urgency into a problem they do not feel. You can reveal the consequences of a problem they underestimated.',
    'For a proven founder, "we help you post more" is weak. He does not wake up wanting twelve LinkedIn posts. He wants to be the obvious person to buy from.',
  ],
  play(root, api) {
    const rounds = [
      { who: 'Proven founder. Twelve years in. Tired of watching weaker competitors dominate. Hates explaining what they do on every demo call. Depends on referrals.',
        options: ['Your market sees why you are the obvious choice before the first call.', 'We help you post more, every day, without eating your calendar.', 'More attention, with hooks that stop the scroll.', 'Twelve LinkedIn posts a month, in your voice, every Monday.'],
        yes: 'Trust, acquisition, revenue. He can see why it matters before the first call.', no: 'That sells a vehicle number. He does not wake up wanting posts or hooks. He wants to stop explaining himself.' },
      { who: 'Bakery owner. Great bread. Empty shop on weekdays. A chain opens on the same street next month.',
        options: ['Be the bakery the street knows by name before the chain opens.', 'Grow your Instagram following with daily reels from your kitchen.', 'Artisan bread, baked with passion and the finest flour since 2009.', 'A modern loyalty app for independent bakeries that want to grow.'],
        yes: 'It names the fear she already feels and connects the work to surviving the chain.', no: 'Reels, passion, apps. Those are vehicles and features. Her fear is the chain next month.' },
    ];
    quizStage(rounds, (scene, r) => {
      const c = el('div', 'panel body'); c.innerHTML = `<div style="display:flex;gap:5px;align-items:flex-start"><span style="flex:0 0 12px;width:12px;height:18px">${SPR.founder}</span><span>${r.who}</span></div>`;
      scene.appendChild(c);
    }, root, api);
  },
},
{
  name: 'The vehicle', blurb: 'Vehicles come last. Match the message to where the customer already pays attention.',
  intro: [
    'Now you understand the customer, the desire, the mechanism, the message. Only now do you choose how to deliver it.',
    'Founder led content. Meta ads. Email. YouTube. Webinars. Cold calls. These are vehicles. A vehicle affects reach, cost and speed. It cannot repair a missing foundation.',
  ],
  lesson: [
    'Businesses copy successful funnels and still fail. They copied what they could see. They missed the customer insight underneath it.',
    'Choose the platform because your buyer uses it while thinking about the problem you solve. Not because marketers are talking about it.',
    'Spend your afternoon studying people before studying platforms. That lesson outlasts every algorithm.',
  ],
  play(root, api) {
    const rounds = [
      { who: 'The vehicle shop. A salesman waves: "Meta ads! LinkedIn! Webinars! Hot this month. Pick one now, build the message later?"',
        options: ['Build the message first. Then choose the vehicle the customer already uses.', 'Take the LinkedIn package with the proven hook formula. The message can follow.', 'Take the Meta ads bundle. Reach fixes everything if the budget is big enough.'],
        yes: 'The vehicle comes last. It carries the message. It is not the message.', no: 'A weak message does not become strong because you put it in a LinkedIn post with a proven hook.' },
      { who: 'Customer: a proven B2B founder deciding whether to hire a content partner.',
        options: ['LinkedIn, industry podcasts and direct outreach.', 'TikTok trends and a Meta ads retargeting funnel.', 'A billboard on the motorway into the city.'],
        yes: 'Where he already pays attention while thinking about this problem.', no: 'He is not there when he thinks about this problem.' },
      { who: 'Customer: a homeowner whose boiler broke this morning.',
        options: ['Search, referrals and local Meta ads.', 'A LinkedIn thought leadership series on heating.', 'A webinar next Thursday evening.'],
        yes: 'She is searching right now. Meet her there.', no: 'By Thursday she has a new boiler from someone who showed up in search.' },
      { who: 'A founder copies a competitor\'s funnel page by page. It does not work. What is the vehicle?',
        options: ['None yet. Study the customer insight under the funnel first.', 'The same funnel with a better designed landing page.', 'The same webinar with double the ad spend.'],
        yes: 'They copied what they could see. The visible campaign was built on an invisible understanding of the market.', no: 'More money and prettier pages on a copied foundation. Still copying what you can see.' },
    ];
    quizStage(rounds, (scene, r) => {
      const c = el('div', 'panel body'); c.textContent = r.who; scene.appendChild(c);
    }, root, api);
  },
},
];

SCREENS.result = () => {
  setHud(null);
  G.elapsed = Math.round((Date.now() - (G.startedAt || Date.now())) / 1000);
  if (G.score > G.best) { G.best = G.score; save(); }
  const m = G.mistakes;
  const rank = m <= 2 ? 'Marketing god' : m <= 6 ? 'Category definer' : m <= 12 ? 'Funnel copier' : 'Jargon goblin';
  const line = m <= 2 ? 'Your competition thinks you are cheating.' : m <= 6 ? 'You speak to the desire, not the purchase.' : m <= 12 ? 'You copied what you could see. Look underneath.' : 'The caveman is still confused. Read it again.';
  const lesson = 'The vehicle comes last. Marketing begins inside another person\'s mind.';
  const url = /^https?:/.test(location.protocol) ? location.href.split('#')[0] : '';
  const tweet = `I ranked ${rank.toUpperCase()} in GRUNT QUEST (${fmtTweet(G.score)} pts), a 7 minute pixel game built from @leonabboud's article on marketing.\n\nLesson that stuck: ${lesson}${url ? '\n\nPlay: ' + url : ''}`;
  const good = m <= 6;
  const s = el('div', 'scene stack');
  s.innerHTML = `
    <div style="display:flex;gap:6px;align-items:stretch">
      <div class="portrait ${good ? 'nod' : 'shake'}" style="position:static;flex:0 0 64px"><img alt="Ugg the caveman" src="${good ? ART.caveYes : ART.caveNo}"></div>
      <div class="panel body" style="flex:1">
        <div class="rank">${rank}</div>
        <div style="margin-top:3px">${line}</div>
        <div class="row" style="margin-top:4px;justify-content:space-between"><span class="ui">Score <span style="color:var(--deep)">${fmt(G.score)}</span></span><span class="ui" style="color:var(--deep)">${Math.floor(G.elapsed / 60)}:${String(G.elapsed % 60).padStart(2, '0')}</span></div>
      </div>
    </div>
    <div class="panel dark body">
      <div class="label" style="color:var(--amber);margin-bottom:3px">The one afternoon method</div>
      <div class="method">
        <b>Hour 1</b><span>The customer. The urgent moment.</span>
        <b>Hour 2</b><span>The desire. Why, until it hurts.</span>
        <b>Hour 3</b><span>The mechanism. How, in steps.</span>
        <b>Hour 4</b><span>The message. Pain, after, proof.</span>
        <b>Hour 5</b><span>The vehicle. Where they look.</span>
      </div>
    </div>
    <div class="row" style="justify-content:space-between">
      <button class="btn" id="share">Share on X</button><button class="btn ghost" id="copy">Copy</button><button class="btn ghost" id="again">Again</button>
    </div>
    <p class="tiny center" style="margin-top:2px">Read the article by <a style="color:var(--ink)" href="https://x.com/leonabboud/article/2094443253495894440" target="_blank" rel="noopener">Leon Abboud</a></p>`;
  view.appendChild(el('div', 'ground')); view.appendChild(el('div', 'horizon'));
  view.appendChild(s);
  $('#share', s).addEventListener('click', () => { SFX.ok(); window.open('https://x.com/intent/post?text=' + encodeURIComponent(tweet), '_blank', 'noopener'); });
  $('#copy', s).addEventListener('click', async e => {
    SFX.ok(); try { await navigator.clipboard.writeText(tweet); e.target.textContent = 'Copied'; later(() => e.target.textContent = 'Copy', 1200); } catch (err) { e.target.textContent = 'Failed'; }
  });
  $('#again', s).addEventListener('click', () => { SFX.ok(); G.unlocked = 0; save(); go('title'); });
  keyHandler = e => { if (e.key === 'Enter') $('#share', s).click(); };
  G._tweet = tweet;
};

/* ---------- boot ---------- */
load(); drawMute();
if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) document.body.classList.add('reduced');
document.fonts && document.fonts.ready.then(() => go('title')).catch(() => go('title'));
if (!document.fonts) go('title');

/* read-only debug surface for QA */
window.GRUNT = {
  get state() { return { screen: G.screen, stage: G.stage, hearts: G.hearts, score: G.score, mistakes: G.mistakes, unlocked: G.unlocked, best: G.best, tweet: G._tweet || null }; },
  stages: STAGES.map(s => ({ name: s.name, blurb: s.blurb })),
  go: name => go(name),
};
})();
